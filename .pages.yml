media:
  input: assets/images
  output: /assets/images

content:
  - name: posts
    label: پست‌ها
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{fields.slug}.md"
    view:
      fields: [title, date]
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: عنوان
        type: string
      - name: slug
        label: آدرس (انگلیسی، با خط تیره، مثل my-first-post)
        type: string
      - name: date
        label: تاریخ
        type: date
      - name: hide_title
        label: پنهان کردن عنوان در صفحه‌ی اصلی
        type: boolean
      - name: body
        label: متن
        type: rich-text